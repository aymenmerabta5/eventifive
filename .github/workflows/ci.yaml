name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy values for build-time env validation (t3-env)
  BETTER_AUTH_SECRET: "dummy-secret-for-ci"
  BETTER_AUTH_URL: "http://localhost:3000/"
  CORS_ORIGIN: "http://localhost:3000/"
  DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
  NEXT_PUBLIC_CLOUDFLARE_TURNSTYLE_PK: "dummy"
  CLOUDFLARE_TURNSTYLE_SK: "dummy"
  RESEND_API_KEY: "re_dummy"
  RESEND_SENDER_EMAIL: "noreply@example.com"
  GOOGLE_CLIENT_ID: "dummy"
  GOOGLE_CLIENT_SECRET: "dummy"
  ARCJET_API: "dummy"
  S3_ENDPOINT: "https://dummy.r2.cloudflarestorage.com/"
  S3_BUCKET_NAME: "dummy"
  S3_REGION: "auto"
  AWS_TOKEN: "dummy"
  AWS_ACCESS_KEY_ID: "dummy"
  AWS_SECRET_ACCESS_KEY: "dummy"
  NEXT_PUBLIC_WEBSOCKET_URL: "localhost:8081"
  CHARGILY_SK: "dummy"
  NEXT_PUBLIC_CHARGILY_PK: "dummy"
  REDIS_URL: "redis://localhost:6379"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build